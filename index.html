<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SteVal — 3D printed projects</title>
<meta name="description" content="SteVal — 3D printed projects at better prices / Progetti stampati in 3D a prezzi migliori.">
<meta name="theme-color" content="#0e0f13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="./"><i>S</i><span>Ste<b>Val</b></span></a>
    <nav class="links">
      <a href="#shop" data-i18n="navShop">Negozio</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="langsw" role="group" aria-label="Language"><button data-lang="it">IT</button><button data-lang="en">EN</button></div>
      <button class="btn ghost" id="accBtn">👤 <span id="accLabel"></span></button>
      <button class="btn ghost" id="installBtn" data-i18n="install" hidden>⬇ Installa app</button>
      <button class="btn ghost cart-btn" id="cartBtn">🛒 <span data-i18n="cart">Carrello</span><span class="count" id="cartCount">0</span></button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <span class="pill" data-i18n="pill"></span>
    <h1 data-i18n-html="heroH1"></h1>
    <p data-i18n="heroP"></p>
  </section>

  <section id="shop">
    <div class="toolbar">
      <h2 data-i18n="shop"></h2>
      <input class="search" id="search" type="search" data-i18n-ph="searchPh">
    </div>
    <div class="chips" id="chips" style="margin-bottom:18px"></div>
    <div class="grid" id="grid"><div class="empty" data-i18n="loading"></div></div>
  </section>
</main>

<footer class="site"><div class="wrap" data-i18n="footer"></div></footer>

<div class="overlay" id="overlay"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="close" id="modalClose" aria-label="Close">✕</button>
  <div class="inner" id="modalBody"></div>
</div>

<div class="modal narrow" id="authModal" role="dialog" aria-modal="true">
  <button class="close" id="authClose" aria-label="Close">✕</button>
  <div class="authbody" id="authBody"></div>
</div>

<aside class="drawer" id="drawer" aria-label="Cart">
  <header><b style="font-size:1.1rem" data-i18n="cartTitle"></b><button class="close" style="position:static" id="drawerClose" aria-label="Close">✕</button></header>
  <div class="items" id="cartItems"></div>
  <footer id="cartFoot">
    <div class="total"><span data-i18n="total"></span><span id="cartTotal"></span></div>
    <input class="f" id="oName" data-i18n-ph="namePh" autocomplete="name" maxlength="80">
    <input class="f" id="oEmail" type="email" data-i18n-ph="emailPh" autocomplete="email" maxlength="120">
    <input class="f" id="oPhone" data-i18n-ph="phonePh" autocomplete="tel" maxlength="30">
    <textarea class="f" id="oNote" data-i18n-ph="notePh" maxlength="1000"></textarea>
    <button class="btn primary" id="sendOrder" data-i18n="sendOrder"></button>
    <small style="color:var(--muted)" data-i18n="orderNote"></small>
  </footer>
</aside>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
